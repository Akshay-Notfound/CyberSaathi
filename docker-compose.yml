version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    container_name: cybercrime_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: cybercrime_db
      POSTGRES_USER: cybercrime_user
      POSTGRES_PASSWORD: cybercrime_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cybercrime_user -d cybercrime_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: cybercrime_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@cybercrime.local
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  postgres_data:
